
services:
  # ─── PostgreSQL Database ───────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: st_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - st_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── SuperTokens Core ─────────────────────────────────────────
  supertokens:
    image: registry.supertokens.io/supertokens/supertokens-postgresql:latest
    container_name: st_core
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${SUPERTOKENS_PORT}:3567"
    environment:
      POSTGRESQL_CONNECTION_URI: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
      API_KEYS: ${SUPERTOKENS_API_KEY}
    networks:
      - st_network
    healthcheck:
      test: >
        bash -c 'exec 3<>/dev/tcp/127.0.0.1/3567 && echo -e "GET /hello HTTP/1.1\r\nhost: 127.0.0.1:3567\r\nConnection: close\r\n\r\n" >&3 && cat <&3 | grep "Hello"'
      interval: 10s
      timeout: 5s
      retries: 10

  # ─── Backend (Express.js) ──────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: st_backend
    restart: unless-stopped
    depends_on:
      supertokens:
        condition: service_healthy
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT}:5000"
    environment:
      PORT: 5000
      SUPERTOKENS_CONNECTION_URI: "http://supertokens:3567"
      SUPERTOKENS_API_KEY: ${SUPERTOKENS_API_KEY}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      API_DOMAIN: ${API_DOMAIN}
      WEBSITE_DOMAIN: ${WEBSITE_DOMAIN}
      APP_NAME: ${APP_NAME}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
    networks:
      - st_network

  # ─── Frontend (React + Vite) ───────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: st_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT}:80"
    networks:
      - st_network

# ─── Volumes ───────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local

# ─── Networks ──────────────────────────────────────────────────
networks:
  st_network:
    driver: bridge
